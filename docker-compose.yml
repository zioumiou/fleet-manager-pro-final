version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./data/fleet.db

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend